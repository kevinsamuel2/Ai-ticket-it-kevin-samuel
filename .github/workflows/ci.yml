name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Lint y tests (backend y mobile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests del backend
        run: npm test --workspace=backend

      - name: Tests de la app mobile
        run: npm test --workspace=mobile

  docker:
    name: Build de la imagen del backend
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -f packages/backend/Dockerfile -t ai-ticket-it-backend .
